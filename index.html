<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<!-- The tab icon is the player creature from the title card below (row 23's
     mark, the same path and eyes, cropped to the one creature - three at 16px
     would be a smear), inlined so the page stays self-contained. It replaced a
     blank `data:,` that only suppressed the 404. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='14 12 64 64'%3E%3Cpath d='M46 74c-16 0-25-13-25-28S32 16 46 16s25 15 25 30-9 28-25 28z' fill='%23ff8a4c'/%3E%3Ccircle cx='37' cy='35' r='9' fill='%23fff'/%3E%3Ccircle cx='55' cy='35' r='9' fill='%23fff'/%3E%3Ccircle cx='39' cy='37' r='4' fill='%232a1c2e'/%3E%3Ccircle cx='57' cy='37' r='4' fill='%232a1c2e'/%3E%3C/svg%3E">
<title>Onigokko</title>
<style>
  :root {
    --ink: #1b2430;
    --panel: rgba(252, 250, 246, 0.92);
    --accent: #ff8a4c;
    --accent-2: #7fe3ff;
    --danger: #d6ff3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #bcd9ee;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; z-index: 2; }

  /* The HUD is a canvas, so it cannot use env() itself. This element declares
     the insets as padding and view/hud.js reads them back as numbers, which is
     what keeps the timer ring out from under the notch and the boost meter off
     the home indicator. */
  #safe-probe {
    position: fixed; top: 0; left: 0; width: 0; height: 0;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    pointer-events: none; visibility: hidden;
  }


  /* ---- pause, as a corner glyph ----
     z-index 2 and declared after #hud, so it paints over the HUD and still sits
     under any .screen (3). It is the only fixed thing in the play area with
     pointer-events, so everything outside its 52 px still reaches the canvas -
     steering and boost are untouched. Held inside the safe-area insets, and only
     on screen while a round is up (body.playing). */
  .corner-btn {
    position: fixed; z-index: 2;
    top: max(12px, env(safe-area-inset-top, 0px));
    left: max(12px, env(safe-area-inset-left, 0px));
    width: 52px; height: 52px; border-radius: 16px;
    border: none; cursor: pointer; padding: 0;
    display: none; place-items: center;
    background: rgba(252, 250, 246, 0.62);
    box-shadow: 0 4px 14px rgba(14, 30, 50, 0.2);
    transition: transform 0.12s ease;
  }
  body.playing .corner-btn { display: grid; }
  .corner-btn svg { width: 22px; height: 22px; fill: rgba(27, 36, 48, 0.72); }
  .corner-btn:active { transform: scale(0.94); }

  /* Fits or scrolls. The screen is fixed inset:0, so its height IS the visible
     viewport - no svh/dvh needed, and iOS toolbar resizes come for free. The
     centering must be the card's own auto margins, not justify-content:center,
     because center distributes NEGATIVE free space to both ends too - which is
     exactly the both-ends-clipped, nothing-scrollable failure (a 470 px title
     card in a 375 px landscape phone lost 47.5 px off each end). Auto margins
     collapse to 0 once the card is taller than the screen, so the top is always
     reachable and the rest scrolls. The safe-area padding stays on the screen,
     so the scroll extremes still clear the notch and the home indicator. */
  .screen {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center;
    gap: 22px;
    overflow-y: auto;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px))
             max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
    background: radial-gradient(120% 90% at 50% 30%, rgba(188, 217, 238, 0.55), rgba(70, 110, 150, 0.72));
    backdrop-filter: blur(3px);
  }
  .screen.hidden { display: none; }

  .card {
    background: var(--panel);
    border-radius: 26px;
    padding: 26px 30px;
    box-shadow: 0 18px 50px rgba(14, 30, 50, 0.28);
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    max-width: min(94vw, 420px);
    /* flex-shrink 0, or flexbox squashes the card to fit instead of letting it
       overflow into the scroll; margin auto is the fits-or-scrolls centering
       described on .screen. */
    flex-shrink: 0;
    margin: auto 0;
  }

  /* ---- the play button: a big soft blob with a play glyph ---- */
  .play-btn {
    width: 116px; height: 116px; border-radius: 50%;
    border: none; cursor: pointer;
    background: radial-gradient(circle at 38% 32%, #ffb27e, var(--accent));
    box-shadow: 0 10px 26px rgba(255, 138, 76, 0.5);
    display: grid; place-items: center;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:active { transform: scale(0.96); }
  .play-btn svg { width: 46px; height: 46px; margin-left: 6px; fill: #fff; }

  /* ---- control glyphs ---- */
  .glyphs { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
  /* Control glyphs are SWAPPED, not merely hidden: a touch device was being
     told to press WASD and SHIFT, neither of which it has. These have to carry
     the same specificity as .glyphs and come after it, or .glyphs{display:flex}
     wins and both sets are drawn at once. */
  .glyphs.touch-only { display: none; }
  body.touch .glyphs.key-only { display: none; }
  body.touch .glyphs.touch-only { display: flex; }
  .glyph { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .keys { display: grid; grid-template-columns: repeat(3, 24px); grid-auto-rows: 24px; gap: 3px; }
  .key {
    border: 2px solid rgba(27, 36, 48, 0.55); border-radius: 6px;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
    color: rgba(27, 36, 48, 0.75);
  }
  .key.blank { border: none; }
  .key.wide { grid-column: span 3; width: auto; border-radius: 8px; font-size: 10px; letter-spacing: 0.06em; }
  .glyph svg { width: 30px; height: 30px; }

  /* ---- toggles ---- */
  .toggles { display: flex; gap: 14px; }
  .toggle {
    width: 54px; height: 54px; border-radius: 16px; cursor: pointer;
    border: 2px solid rgba(27, 36, 48, 0.22);
    background: rgba(255, 255, 255, 0.6);
    display: grid; place-items: center;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
  }
  .toggle svg { width: 26px; height: 26px; stroke: rgba(27, 36, 48, 0.62); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .toggle[aria-pressed="true"] { background: var(--accent-2); border-color: rgba(27, 36, 48, 0.5); }
  .toggle[aria-pressed="true"] svg { stroke: #10242e; }
  .toggle:active { transform: scale(0.94); }
  .toggle .off-slash { display: none; }
  .toggle[aria-pressed="false"] .off-slash { display: block; }
  /* Round, and carries no aria-pressed, so none of the pressed/slash rules above
     can reach it: an action, not a setting. */
  .toggle.mini { border-radius: 50%; }

  /* ---- the wipe action (ledger row 25) ----
     Pushed a second gap's width away from the three settings so the row reads
     as [settings] .. [danger], not four of a kind. Its own touch-action,
     because the title card scrolls on short viewports and html's `none` stops
     at the scroll container (.screen) - and a hold that starts panning the
     card is a hold the player never got to finish. */
  #wipe { margin-left: 14px; position: relative; touch-action: none; }
  /* The confirmation ring. Drawn over the button's own border, filling from
     12 o'clock; the dash offset is driven from main.js off the Hold machine's
     progress, and 150.8 is 2*PI*24 for the r=24 circle below. */
  #wipe .hold-ring {
    position: absolute; inset: -2px; width: auto; height: auto;
    stroke: #d8543f; stroke-width: 3; fill: none;
    transform: rotate(-90deg);
    pointer-events: none;
  }
  #wipe .hold-ring circle {
    stroke-dasharray: 150.8;
    stroke-dashoffset: 150.8;
  }
  /* The one wordless beat after a completed wipe: the bin pops, once. Shape
     only, well under a second - and not at all for a player who asked for
     stillness, where the toggle row snapping back to defaults and the trophy
     leaving the card are the confirmation. */
  #wipe.wiped .bin { animation: wipe-pop 0.55s ease-out 1; }
  @keyframes wipe-pop {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.3); }
  }
  body.reduced #wipe.wiped .bin { animation: none; }
  /* The other outcome (second-member review, HIGH): the hold completed and the
     storage refused to let go. The pop above is a CLAIM, so it must not play -
     the button shakes its head once instead, shape only and shorter than the
     pop. Stillness rule as above: no animation, and there the reading is the
     trophy and the toggle row STAYING where they were. */
  #wipe.wipe-failed { animation: wipe-no 0.4s ease-out 1; }
  @keyframes wipe-no {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-4px); }
    70% { transform: translateX(4px); }
  }
  body.reduced #wipe.wipe-failed { animation: none; }
  /* The failure's PERSISTENT half (second-member review, round 2). The shake
     above is motion, and motion is the one thing a player who asked for
     stillness has said they do not want - so under either switch the failure
     had no visible signal at all, and the live region that carries the words is
     clipped to 1px. This is a SHAPE: a small cross badge on the corner of the
     control, drawn from two crossing gradients (no text, no image file, no
     rendered character - the wordless budget is untouched), no animation
     anywhere in the rule, so it is identical under `body.reduced` and under
     prefers-reduced-motion. It is cleared by the next DELIBERATE ATTEMPT and by
     nothing else (main.js: armHold for the bin, the click handler for the
     toggle) - never by a timer, so it is still there when the player looks
     back. Shared by the bin and the consent toggle, which fail the same way. */
  .toggle.failed-mark { position: relative; }
  .toggle.failed-mark::after {
    content: '';
    position: absolute; right: -3px; top: -3px;
    width: 18px; height: 18px; border-radius: 50%;
    background-color: #d8543f;
    background-image:
      linear-gradient(45deg, transparent 40%, #fff 40%, #fff 60%, transparent 60%),
      linear-gradient(-45deg, transparent 40%, #fff 40%, #fff 60%, transparent 60%);
    pointer-events: none;
  }
  /* The wipe's one polite live region: heard, never seen. The clip pattern and
     not display:none, which mutes a live region; 1px and off-flow so it costs
     the layout nothing and renders no characters - the wordless budget counts
     rendered text, and this node ships empty and is only ever spoken. */
  #wipe-status {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  .row { display: flex; gap: 14px; align-items: center; justify-content: center; }

  /* ---- result ---- */
  .big { font-size: 62px; line-height: 1; font-weight: 800; }
  .big.ok { color: #3fae6a; }
  .big.bad { color: #d8543f; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(52px, 1fr)); gap: 12px; width: 100%; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .stat svg { width: 22px; height: 22px; }
  .stat b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .best { display: flex; align-items: center; gap: 8px; opacity: 0.72; font-size: 15px; }
  .best svg { width: 18px; height: 18px; }
  .best b { font-variant-numeric: tabular-nums; }
  /* Hidden while there is nothing to show: a trophy reading 0 is noise on a
     first-time player's screen. Needs the class weight, because `.best` would
     otherwise beat the [hidden] attribute. */
  .best.hidden { display: none; }

  /* ---- a record run ----
     The signal is a SHAPE first - a sparkle that is simply absent on an ordinary
     run - and colour second, so it reads for a colour-blind player and it
     survives reduced motion, where only the movement is dropped. Nothing here
     is full-screen, and the pulse is 0.9 Hz, well under the 3 Hz threshold. */
  .best .spark { display: none; }
  .best.record { opacity: 1; }
  .best.record .spark { display: block; animation: spark-pop 1.1s ease-out 3; }
  .best.record .cup { stroke: #c08417; }
  .best.record b { color: #96660c; }
  @keyframes spark-pop {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.28); opacity: 1; }
  }
  /* Both switches, because the in-app motion toggle is not the media query: the
     player can have asked for stillness in either place. */
  body.reduced .best.record .spark { animation: none; }

  @media (max-width: 420px) {
    .card { padding: 20px 18px; gap: 15px; border-radius: 20px; }
    .play-btn { width: 96px; height: 96px; }
    .play-btn svg { width: 38px; height: 38px; }
    .big { font-size: 50px; }
    .stat b { font-size: 16px; }
    .toggle { width: 48px; height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .play-btn, .toggle, .corner-btn { transition: none; }
    .best.record .spark { animation: none; }
    #wipe.wiped .bin { animation: none; }
    #wipe.wipe-failed { animation: none; }
  }

  /* ---- degraded surfaces (ledger row 23) ----
     Three ways the page can die that all used to look the same: a silent blank
     sky. Each failure now gets the game's own visual language and not one word.
     Opaque backgrounds on purpose - the thing behind these screens is exactly
     what can no longer be trusted to draw. */
  #no-script { z-index: 5; background: #bcd9ee; }
  #gl-lost { z-index: 4; background: #bcd9ee; }
  /* Reload is offered, not led with: a restore that arrives in its first few
     seconds should be met by nothing but the round coming back. */
  #gl-retry { display: none; }
  #gl-lost.stalled #gl-retry { display: grid; }
  /* The dead play button: the same blob, drained of its colour, wearing the
     retry arrow instead of the play triangle. */
  .play-btn.dead { background: radial-gradient(circle at 38% 32%, #b7c2cd, #8593a2); box-shadow: 0 10px 26px rgba(90, 105, 120, 0.4); }
  .play-btn.dead svg { margin-left: 0; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  /* The best that could not be written: a save arrow with a line through it,
     only on the result card and only while the write is still owed. */
  .best .owed-mark { display: none; }
  .best.owed .owed-mark { display: block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="safe-probe" aria-hidden="true"></div>
<!-- The wipe's outcome, for ears (ledger row 25): "data reset" on the fire
     frame when the storage verifiably let go, "data not reset" on the fire
     frame when it did not (second-member review, HIGH - the pop and the blank
     trophy are the sighted half of the same distinction), "cancelled" for a
     keyboard hold let go early. Body-level and never
     moved - a live region re-parented mid-life loses its registration in some
     screen readers, and the settings row that holds the wipe is moved between
     cards. Empty at load; main.js sets and clears it. -->
<div id="wipe-status" role="status" aria-live="polite"></div>

<button id="pause-btn" class="corner-btn" aria-label="pause">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
</button>

<!-- ============ TITLE (icon only, no words anywhere) ============ -->
<div id="title" class="screen">
  <div id="title-card" class="card">
    <!-- The species, as the logo. Three of them, not two: the title card used
         to show only the player and a hunter, so the entire POINT of the game -
         that the little yellow ones are worth points and you are supposed to
         chase them - appeared nowhere before you started playing, and barely
         afterwards. The ko is drawn with its ground ring and a star so it reads
         as "collect", and it is placed on the player's side of the frame. -->
    <svg width="210" height="90" viewBox="0 0 210 90" aria-label="game">
      <ellipse cx="46" cy="76" rx="26" ry="6" fill="rgba(20,40,25,0.16)"/>
      <ellipse cx="168" cy="76" rx="24" ry="6" fill="rgba(20,40,25,0.16)"/>

      <!-- ko, with its ring and a star -->
      <ellipse cx="108" cy="74" rx="19" ry="5.5" fill="none" stroke="#e8c14a" stroke-width="2.4" opacity="0.75"/>
      <path d="M108 72c-11 0-17-9-17-19s7-20 17-20 17 10 17 20-6 19-17 19z" fill="#ffd95c"/>
      <circle cx="102" cy="43" r="6.4" fill="#fff"/><circle cx="114" cy="43" r="6.4" fill="#fff"/>
      <circle cx="103.5" cy="44.5" r="3" fill="#2a2033"/><circle cx="115.5" cy="44.5" r="3" fill="#2a2033"/>
      <path d="M108 6l2.6 5.6 6 .8-4.4 4.2 1.1 6.1-5.3-2.9-5.3 2.9 1.1-6.1L99.4 12.4l6-.8z"
            fill="#ffd45e" stroke="rgba(27,36,48,0.4)" stroke-width="1.1" stroke-linejoin="round"/>

      <!-- player -->
      <path d="M46 74c-16 0-25-13-25-28S32 16 46 16s25 15 25 30-9 28-25 28z" fill="#ff8a4c"/>
      <circle cx="37" cy="35" r="9" fill="#fff"/><circle cx="55" cy="35" r="9" fill="#fff"/>
      <circle cx="39" cy="37" r="4" fill="#2a1c2e"/><circle cx="57" cy="37" r="4" fill="#2a1c2e"/>

      <!-- hunter -->
      <path d="M154 22l6-11 5 11zM168 18l6-13 6 13zM182 22l6-11 5 11z" fill="#d6ff3a"/>
      <path d="M168 74c-15 0-24-13-24-28s10-30 24-30 24 15 24 30-9 28-24 28z" fill="#4b2a70"/>
      <circle cx="159" cy="35" r="8.5" fill="#fff"/><circle cx="177" cy="35" r="8.5" fill="#fff"/>
      <circle cx="161" cy="37" r="4" fill="#d6ff3a"/><circle cx="179" cy="37" r="4" fill="#d6ff3a"/>
    </svg>

    <button id="play" class="play-btn" aria-label="play">
      <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
    </button>

    <!-- Ledger row 23: what the play button becomes when the module never
         boots. Hidden inline so a healthy boot never paints it for even one
         frame; the inline guard at the end of the page is the only thing that
         swaps it in, and tapping it reloads. -->
    <button id="boot-retry" class="play-btn dead" aria-label="retry" style="display:none">
      <svg viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 11-2.4-5.7"/>
        <path d="M20 3.5V9h-5.5"/>
      </svg>
    </button>

    <!-- The number to beat, under the button that starts the attempt - and only
         once there is one. A player who has never scored sees nothing here. -->
    <div id="title-best" class="best hidden">
      <svg class="cup" viewBox="0 0 24 24" aria-label="best" fill="none" stroke="rgba(27,36,48,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4h10v4a5 5 0 01-10 0z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"/>
        <path d="M9 20h6M12 13v7"/>
      </svg>
      <b id="title-best-score">0</b>
    </div>

    <div class="glyphs key-only">
      <div class="glyph">
        <div class="keys">
          <div class="key blank"></div><div class="key">W</div><div class="key blank"></div>
          <div class="key">A</div><div class="key">S</div><div class="key">D</div>
        </div>
      </div>
      <div class="glyph">
        <div class="keys"><div class="key wide">SHIFT</div></div>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="#ffd45e" stroke="rgba(27,36,48,0.5)" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="glyph">
        <svg viewBox="0 0 34 24" aria-hidden="true">
          <path d="M3 18h28" stroke="rgba(27,36,48,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="10" cy="12" r="5" fill="#ff8a4c"/>
          <path d="M18 12h9m0 0l-3-3m3 3l-3 3" stroke="rgba(27,36,48,0.55)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- The same three facts for a device with no keyboard: drag the left of
         the screen to steer, tap the right to boost, and the throttle is
         automatic. Matches view/input.js exactly, including the 0.62 split. -->
    <div class="glyphs touch-only">
      <div class="glyph">
        <svg viewBox="0 0 44 30" aria-hidden="true">
          <rect x="1" y="1" width="24" height="28" rx="5" fill="none" stroke="rgba(27,36,48,0.35)" stroke-width="1.6"/>
          <circle cx="13" cy="15" r="4.6" fill="#ff8a4c"/>
          <path d="M22 15h6m0 0l-2.6-2.6M28 15l-2.6 2.6" stroke="rgba(27,36,48,0.6)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 15h-2m0 0l2.6-2.6M2 15l2.6 2.6" stroke="rgba(27,36,48,0.6)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="glyph">
        <svg viewBox="0 0 44 30" aria-hidden="true">
          <rect x="19" y="1" width="24" height="28" rx="5" fill="none" stroke="rgba(27,36,48,0.35)" stroke-width="1.6"/>
          <circle cx="31" cy="15" r="9" fill="none" stroke="rgba(27,36,48,0.3)" stroke-width="1.4"/>
          <path d="M32 7l-6 9h4l-1 7 6-9h-4z" fill="#ffd45e" stroke="rgba(27,36,48,0.5)" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="glyph">
        <svg viewBox="0 0 34 24" aria-hidden="true">
          <path d="M3 18h28" stroke="rgba(27,36,48,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="10" cy="12" r="5" fill="#ff8a4c"/>
          <path d="M18 12h9m0 0l-3-3m3 3l-3 3" stroke="rgba(27,36,48,0.55)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 4.5a5 5 0 019 0" stroke="rgba(27,36,48,0.35)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- ONE live node, moved between this card and the pause card by main.js.
         Two copies would need their aria-pressed kept in step, and the first
         time they disagreed the settings would be lying about themselves. -->
    <div id="toggles" class="toggles">
      <button id="consent" class="toggle" aria-pressed="false" aria-label="telemetry">
        <svg viewBox="0 0 24 24">
          <path d="M4 19V9M9.5 19V5M15 19v-8M20.5 19v-5"/>
          <line class="off-slash" x1="3" y1="21" x2="21" y2="3"/>
        </svg>
      </button>
      <!-- Pressed = motion ON, the same direction as the sound toggle beside it.
           It used to be pressed = MORE reduction, so lighting up the button and
           lighting up the one next to it meant opposite things. The stored
           preference is still `reducedMotion`; only which way the button reads
           has changed. -->
      <button id="motion" class="toggle" aria-pressed="true" aria-label="motion">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7"/>
          <path d="M12 5v7l4 3"/>
          <line class="off-slash" x1="3" y1="21" x2="21" y2="3"/>
        </svg>
      </button>
      <button id="audio" class="toggle" aria-pressed="true" aria-label="sound">
        <svg viewBox="0 0 24 24">
          <path d="M5 9v6h3l4 4V5L8 9z"/>
          <path d="M16 9.5a3.5 3.5 0 010 5M18.5 7a7 7 0 010 10"/>
          <line class="off-slash" x1="3" y1="21" x2="21" y2="3"/>
        </svg>
      </button>
      <!-- The fourth control is an ACTION - wipe every stored byte - so it
           follows the .mini precedent (round, no aria-pressed) and stands a
           gap apart from the three settings. It fires only on a HELD input -
           a pointer, or Enter/Space held on it - never on a click; main.js
           wires both channels through the one hold. The description is the
           hold taught statically, for a reader that cannot see the ring: an
           aria string, the established wordless exception (row 19). -->
      <button id="wipe" class="toggle mini" aria-label="reset all data" aria-description="hold to confirm">
        <svg class="bin" viewBox="0 0 24 24">
          <path d="M9.5 6.5V4.5h5v2"/>
          <path d="M4.5 6.5h15"/>
          <path d="M6.5 6.5l1 13h9l1-13"/>
          <path d="M10 10.5v5.5M14 10.5v5.5"/>
        </svg>
        <svg class="hold-ring" viewBox="0 0 54 54" aria-hidden="true">
          <circle cx="27" cy="27" r="24"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- ============ PAUSE (resume, restart, quit - and the toggle row, which is
     moved in here from the title card rather than copied) ============ -->
<div id="pause" class="screen hidden">
  <div id="pause-card" class="card">
    <button id="resume" class="play-btn" aria-label="resume">
      <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
    </button>
    <div class="row">
      <button id="restart" class="toggle mini" aria-label="restart">
        <svg viewBox="0 0 24 24">
          <path d="M20 12a8 8 0 11-2.4-5.7"/>
          <path d="M20 3.5V9h-5.5"/>
        </svg>
      </button>
      <button id="home" class="toggle mini" aria-label="home">
        <svg viewBox="0 0 24 24">
          <path d="M4 11l8-6.5 8 6.5"/>
          <path d="M6.5 10v9h11v-9"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- ============ RESULT (icons + numbers only) ============ -->
<div id="result" class="screen hidden">
  <div class="card">
    <div id="result-icon" class="big ok"></div>

    <!-- How long the run actually lasted, straight under the glyph that ended
         it - and only on a round that was cut short, because a survived round
         is always the full clock. Before this row the card's one seconds
         figure was the air-time stat below, so a 56 s death read as "5s". -->
    <div id="result-time-row" class="best hidden">
      <svg viewBox="0 0 24 24" aria-label="time survived" fill="none" stroke="rgba(27,36,48,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13.5" r="7.5"/>
        <path d="M12 13.5V9.5"/>
        <path d="M9.5 2.5h5M12 2.5V6"/>
      </svg>
      <b id="result-time">0s</b>
    </div>

    <div class="stats">
      <!-- The four stats carried English `title=` tooltips: rendered words, in
           one language, in a build whose whole constraint is that it has none.
           The names live on the SVGs as aria-label now - assistive, never
           painted - and the glyph is what a sighted player reads. -->
      <div class="stat">
        <svg viewBox="0 0 24 24" aria-label="score"><path d="M12 2l2.9 6.2 6.6.9-4.8 4.7 1.2 6.7L12 17.3 6.1 20.5l1.2-6.7L2.5 9.1l6.6-.9z" fill="#ffd45e" stroke="rgba(27,36,48,0.4)" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <b id="result-score">0</b>
      </div>
      <div class="stat">
        <!-- #ffd95c, matching SPECIES.ko.color and KO_COLORS[0]. This was mint
             green, which is not a colour any ko in the game is, so the one
             stat that says "you did the thing the game is about" was labelled
             with a creature the player had never seen. -->
        <svg viewBox="0 0 24 24" aria-label="kos caught">
          <path d="M12 21c-5 0-8-4-8-9s3-9 8-9 8 4 8 9-3 9-8 9z" fill="#ffd95c" stroke="rgba(27,36,48,0.4)" stroke-width="1.2"/>
          <circle cx="9" cy="10" r="2.6" fill="#fff"/><circle cx="15" cy="10" r="2.6" fill="#fff"/>
          <circle cx="9.6" cy="10.6" r="1.2" fill="#2a2033"/><circle cx="15.6" cy="10.6" r="1.2" fill="#2a2033"/>
        </svg>
        <b id="result-kos">0</b>
      </div>
      <div class="stat">
        <svg viewBox="0 0 24 24" aria-label="best chain" fill="none" stroke="rgba(27,36,48,0.62)" stroke-width="2" stroke-linecap="round">
          <path d="M9.5 14.5l5-5"/>
          <path d="M7 12l-2 2a3.5 3.5 0 005 5l2-2"/>
          <path d="M17 12l2-2a3.5 3.5 0 00-5-5l-2 2"/>
        </svg>
        <b id="result-chain">0</b>
      </div>
      <div class="stat">
        <svg viewBox="0 0 24 24" aria-label="air time" fill="none" stroke="rgba(27,36,48,0.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 19c4-1 6-6 9-6s5 3 9 1"/>
          <circle cx="12" cy="6" r="2.6" fill="#ff8a4c" stroke="none"/>
          <path d="M8.4 9.4L12 6l3.6 3.4"/>
        </svg>
        <b id="result-air">0s</b>
      </div>
    </div>

    <!-- Two values, not one. The star in the stats row above is THIS run; this
         is the best there has ever been. They used to be the same number by
         accident - the trophy was max(best, thisRun) against a best that was
         always 0 - so the line the player read as a record was their current
         score wearing a trophy. The sparkle appears only when this run IS the
         record, which is the one case where both numbers agree honestly. -->
    <div id="result-best-row" class="best">
      <svg class="cup" viewBox="0 0 24 24" aria-label="best" fill="none" stroke="rgba(27,36,48,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4h10v4a5 5 0 01-10 0z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"/>
        <path d="M9 20h6M12 13v7"/>
      </svg>
      <b id="result-best">0</b>
      <svg class="spark" viewBox="0 0 24 24" aria-label="new best">
        <path d="M12 3q1 8 9 9-8 1-9 9-1-8-9-9 8-1 9-9z" fill="#e9a92a" stroke="rgba(27,36,48,0.32)" stroke-width="1" stroke-linejoin="round"/>
      </svg>
      <!-- Ledger row 23: the trophy that could not be written. Shown only
           while the write is owed (save.value ahead of save.saved), so a
           working storage never shows it and a recovered one takes it down. -->
      <svg class="owed-mark" viewBox="0 0 24 24" aria-label="not saved" fill="none" stroke="#d8543f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v8m0 0l-3.2-3.2M12 12l3.2-3.2"/>
        <path d="M5 16v3.5h14V16"/>
        <line x1="4.5" y1="21" x2="19.5" y2="4"/>
      </svg>
    </div>

    <!-- The round's seed, under the trophy: the one number that names the
         world the player just drove (terrain, spawns, hunter openings - not
         the inputs). "That round felt unfair at 0:12" becomes ?seed=N for the
         next agent. Numerals are the wordless exception the card already
         makes; the die is the glyph. Hidden until main.js has a finite seed
         to show, so a card can never wear a seed it does not have. -->
    <div id="result-seed-row" class="best hidden">
      <svg viewBox="0 0 24 24" aria-label="seed" fill="none" stroke="rgba(27,36,48,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="3.5"/>
        <circle cx="8.6" cy="8.6" r="1.3" fill="rgba(27,36,48,0.6)" stroke="none"/>
        <circle cx="12" cy="12" r="1.3" fill="rgba(27,36,48,0.6)" stroke="none"/>
        <circle cx="15.4" cy="15.4" r="1.3" fill="rgba(27,36,48,0.6)" stroke="none"/>
      </svg>
      <b id="result-seed">0</b>
    </div>

    <button id="again" class="play-btn" aria-label="play again">
      <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
    </button>
  </div>
</div>

<!-- ============ CONTEXT LOST (ledger row 23) ============
     The GPU took the canvas away. main.js pauses any running round through the

  </div>
</div>

<script type="module" src="./main.js"></script>
<script>
/* Boot guard (ledger row 23). Inline and dependency-free, because the failure
   it exists for is the module graph never arriving. Three signals, two of them
   immediate: the module tag's own error event (a fetch or parse failure
   anywhere in the graph), an uncaught error before boot finishes (WebGL
   refused, a throw in module scope), and a long timeout as the backstop for a
   silent hang. A SLOW boot is not a FAILED boot: nothing on this page is
   remote, so a healthy boot is parse time - seconds at the very worst - and
   never fires either error event. The 10 s backstop only catches hangs, and if
   a boot somehow lands after it, ok() takes the failed state back down - the
   retry glyph must never lie about a boot that was still coming. Inert on
   success: no DOM is touched until a signal, so there is nothing to flash. */
(function () {
  var BOOT_TIMEOUT = 10000;
  var play = document.getElementById('play');
  var retry = document.getElementById('boot-retry');
  var mod = document.querySelector('script[type="module"]');
  var booted = false;

  function fail() {
    if (booted || !play || !retry) return;
    play.style.display = 'none';
    retry.style.display = 'grid';
  }
  function winError() { if (!booted) fail(); }

  if (retry) retry.addEventListener('click', function () { location.reload(); });
  if (mod) mod.addEventListener('error', fail);
  window.addEventListener('error', winError);
  var timer = setTimeout(winError, BOOT_TIMEOUT);

  window.__ofaBoot = {
    ok: function () {
      booted = true;
      clearTimeout(timer);
      window.removeEventListener('error', winError);
      if (play && retry) { play.style.display = ''; retry.style.display = 'none'; }
    },
  };
})();
</script>
